.pick{background:#122b4f;color:#cfe0f5}
.pick.on{background:#fff;color:var(--navy)}
.dl{background:var(--gold);color:var(--navy);font-size:17px;padding:15px 28px}
#out{width:100%;max-width:540px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);display:block}
.note{font-size:13px;color:#9fb0c6;max-width:540px;text-align:center}

const W = 1080, H = 1350;
const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
const x = cv.getContext('2d');
let foto = 'fotos/cadetes.jpg';

function loadImg(src){ return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
function rr(px, py, w, h, r){ x.beginPath(); x.moveTo(px+r, py); x.arcTo(px+w, py, px+w, py+h, r); x.arcTo(px+w, py+h, px, py+h, r); x.arcTo(px, py+h, px, py, r); x.arcTo(px, py, px+w, py, r); x.closePath(); }
function wrap(text, px, py, maxW, lh){ const words = text.split(' '); let line = ''; for (const w of words){ const t = line ? line + ' ' + w : w; if (x.measureText(t).width > maxW && line){ x.fillText(line, px, py); line = w; py += lh; } else line = t; } x.fillText(line, px, py); return py; }
function fitText(t, maxW, size, font){ let s = size; do { x.font = font.replace('{s}', s); s -= 2; } while (x.measureText(t).width > maxW && s > 20); }

async function draw(){
  await document.fonts.ready;
  try { await Promise.all(['800 150px "Barlow Condensed"','700 40px "Barlow Condensed"','600 25px Inter','700 22px Inter','400 20px Inter'].map(f => document.fonts.load(f))); } catch(e){}
  const img = await loadImg(foto);
  x.fillStyle = '#0b1f3a'; x.fillRect(0, 0, W, H);

  // Foto real
  const PH = 640;
  if (img){
    const s = Math.max(W / img.width, PH / img.height), iw = img.width * s, ih = img.height * s;
    x.drawImage(img, (W - iw) / 2, (PH - ih) / 2, iw, ih);
    document.getElementById('msg').textContent = 'Foto real: Armada de Colombia / Comando General de las Fuerzas Militares. Tamaño 1080×1350 para WhatsApp e Instagram.';
  } else {
    const g = x.createLinearGradient(0, 0, W, PH); g.addColorStop(0, '#0e5aa7'); g.addColorStop(1, '#0b1f3a'); x.fillStyle = g; x.fillRect(0, 0, W, PH);
    document.getElementById('msg').textContent = 'No se pudo cargar la foto en este momento. Recarga la página o prueba con otra foto.';
  }
  const fade = x.createLinearGradient(0, PH - 330, 0, PH); fade.addColorStop(0, 'rgba(11,31,58,0)'); fade.addColorStop(1, 'rgba(11,31,58,1)');
  x.fillStyle = fade; x.fillRect(0, PH - 330, W, 330);
  const top = x.createLinearGradient(0, 0, 0, 180); top.addColorStop(0, 'rgba(11,31,58,.55)'); top.addColorStop(1, 'rgba(11,31,58,0)');
  x.fillStyle = top; x.fillRect(0, 0, W, 180);

  // Etiqueta
  x.font = '800 22px Inter'; const tag = 'SIMULADOR GRATUITO 2026–2027'; x.letterSpacing = '3px';
  const tw = x.measureText(tag).width + 48; rr(64, 52, tw, 52, 26); x.fillStyle = '#c9a227'; x.fill();
  x.fillStyle = '#0b1f3a'; x.textBaseline = 'middle'; x.fillText(tag, 88, 79); x.letterSpacing = '0px';

  // Título
  x.textBaseline = 'alphabetic';
  x.font = '800 150px "Barlow Condensed"'; x.fillStyle = '#ffffff'; x.fillText('RUMBO A LA', 60, 618);
  x.fillStyle = '#e6c45a'; x.fillText('ARMADA', 60, 748);
  x.font = '400 32px Inter'; x.fillStyle = '#dce8f7';
  wrap('Prepárate para entrar a la Armada de Colombia como cadete, grumete o infante de marina.', 64, 806, 950, 42);

  // Puntos fuertes
  const items = ['Simulacro de 50 preguntas con reloj','Pruebas psicotécnicas completas','Memoria y personalidad','Entrevista y prueba física','¿Cumplo los requisitos?','Cada examen cambia'];
  const cw = (W - 128 - 14) / 2, ch = 64;
  items.forEach((t, i) => {
    const cx = 64 + (i % 2) * (cw + 14), cy = 880 + Math.floor(i / 2) * (ch + 12), last = i === items.length - 1;
    rr(cx, cy, cw, ch, 14); x.fillStyle = last ? '#c9a227' : '#122b4f'; x.fill();
    x.fillStyle = last ? '#0b1f3a' : '#ffffff'; x.font = (last ? '700' : '600') + ' 24px Inter'; x.textBaseline = 'middle';
    x.fillText(t, cx + 20, cy + ch / 2);
  });
  x.textBaseline = 'alphabetic';

  // Banda blanca con QR y URL
  const by = 1122, bh = 150; rr(64, by, W - 128, bh, 24); x.fillStyle = '#ffffff'; x.fill();
  const qs = 118, qx = 92, qy = by + (bh - qs) / 2;
  x.save(); x.translate(qx, qy); x.scale(qs / QR.n, qs / QR.n); x.fillStyle = '#0b1f3a'; x.fill(new Path2D(QR.d)); x.restore();
  x.fillStyle = '#0e5aa7'; x.font = '700 20px Inter'; x.letterSpacing = '2px'; x.fillText('ENTRA GRATIS DESDE TU CELULAR', 238, by + 46); x.letterSpacing = '0px';
  x.fillStyle = '#0b1f3a'; fitText('simulador-armada.netlify.app', W - 128 - 200, 58, '800 {s}px "Barlow Condensed"'); x.fillText('simulador-armada.netlify.app', 236, by + 102);
  x.fillStyle = '#3f5470'; x.font = '400 18px Inter'; x.fillText('Funciona sin internet una vez instalada · Español e inglés', 238, by + 132);

  // Pie
  x.fillStyle = '#ffffff'; x.font = '700 22px Inter'; x.fillText('Vibras Positivas HM', 64, 1306);
  const nw = x.measureText('Vibras Positivas HM').width;
  x.fillStyle = '#dce8f7'; x.font = '400 19px Inter'; x.fillText('·  WhatsApp 311 770 0431  ·  Caucasia, Antioquia', 64 + nw + 14, 1306);
  x.fillStyle = '#8fa3bf'; x.font = '400 14px Inter'; x.fillText('Herramienta independiente de práctica. No es un producto oficial de la Armada de Colombia.', 64, 1334);

  try { document.getElementById('out').src = cv.toDataURL('image/png'); }
  catch(e){ document.getElementById('msg').textContent = 'La foto no permite exportar la imagen en este momento.'; }
}
document.querySelectorAll('.pick').forEach(b => b.onclick = () => { document.querySelectorAll('.pick').forEach(o => o.classList.remove('on')); b.classList.add('on'); foto = b.dataset.f; draw(); });
document.getElementById('dl').onclick = () => { try { const a = document.createElement('a'); a.download = 'flyer-rumbo-a-la-armada.png'; a.href = cv.toDataURL('image/png'); a.click(); } catch(e){ alert('No se pudo descargar. Recarga e intenta de nuevo.'); } };
draw();
</script>

</html>
